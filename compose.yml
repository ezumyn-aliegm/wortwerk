services:
  wortwerk:
    build: .
    restart: unless-stopped
    environment:
      WORTWERK_PASSWORD: ${WORTWERK_PASSWORD:?Set a shared study password in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact browser origin in .env}
    ports:
      - "127.0.0.1:4175:4173"
    volumes:
      - wortwerk-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  wortwerk-data:
